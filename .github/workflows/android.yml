name: Android widget QA build
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle -p android testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: opencodex-quota-android-qa
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed QA APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/quota.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          gradle -p android assembleRelease
          rm "$ANDROID_KEYSTORE_PATH"
          cp android/app/build/outputs/apk/release/app-release.apk opencodex-quota.apk
      - name: Publish QA APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-qa || gh release create android-qa --target "$GITHUB_SHA" --prerelease --title "Android widget QA" --notes "Android widget QA build. Install the APK, then connect from your web dashboard. Device verification is ongoing."
          gh release upload android-qa opencodex-quota.apk --clobber
